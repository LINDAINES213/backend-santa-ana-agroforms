name: BE Pytest

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["dev"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend-santa-ana-agroforms-dev

    env:
      DJANGO_SETTINGS_MODULE: backend.settings_test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend-santa-ana-agroforms-dev/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: pytest
