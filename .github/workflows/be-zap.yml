name: ZAP Backend

on:
  pull_request:
    branches: [ "main", "dev", "feat/SANTAANA-v1.0" ]
  push:
    branches: [ "dev", "feat/SANTAANA-v1.0" ]

env:
  DJANGO_SETTINGS_MODULE: backend.settings
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  baseline:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Start Django server
        run: |
          python manage.py runserver 0.0.0.0:8081 &
          sleep 10
          curl --retry 10 --retry-delay 5 --retry-all-errors http://127.0.0.1:8081 || echo "Server starting..."

      - name: ZAP Baseline Scan (2.16.1)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          docker_name: 'zaproxy/zap-stable:2.16.1'
          target: 'http://127.0.0.1:8081'
          cmd_options: '-a -j'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-backend-baseline'
          fail_action: false

      - name: Upload ZAP Baseline Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend-baseline-${{ github.run_number }}
          path: |
            report_html.html
            report_xml.xml
            report_json.json
            zap_out.log
          retention-days: 30

  api_scan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Start Django server
        run: |
          python manage.py runserver 0.0.0.0:8081 &
          sleep 10
          curl --retry 10 --retry-delay 5 --retry-all-errors http://127.0.0.1:8081 || echo "Server starting..."

      - name: ZAP API Scan (2.16.1)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          docker_name: 'zaproxy/zap-stable:2.16.1'
          target: 'http://127.0.0.1:8081/api/schema/'
          format: 'openapi'
          cmd_options: '-a'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-backend-api'
          fail_action: false

      - name: Upload ZAP API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend-api-${{ github.run_number }}
          path: |
            report_html.html
            report_xml.xml
            report_json.json
            zap_out.log
          retention-days: 30

  full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Start Django server
        run: |
          python manage.py runserver 0.0.0.0:8081 &
          sleep 10
          curl --retry 10 --retry-delay 5 --retry-all-errors http://127.0.0.1:8081 || echo "Server starting..."

      - name: ZAP Full Scan (2.16.1)
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          docker_name: 'zaproxy/zap-stable:2.16.1'
          target: 'http://127.0.0.1:8081'
          cmd_options: '-a'
          artifact_name: 'zap-backend-full'
          fail_action: false

      - name: Upload ZAP Full Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend-full-${{ github.run_number }}
          path: |
            report_html.html
            report_xml.xml
            report_json.json
            zap_out.log
          retention-days: 30